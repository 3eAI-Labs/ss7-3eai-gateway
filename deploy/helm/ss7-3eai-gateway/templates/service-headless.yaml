apiVersion: v1
kind: Service
metadata:
  name: {{ include "ss7-3eai-gateway.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ss7-3eai-gateway.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ss7-3eai-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: m3ua
      port: {{ .Values.service.m3ua.port }}
      targetPort: m3ua
      protocol: SCTP
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
