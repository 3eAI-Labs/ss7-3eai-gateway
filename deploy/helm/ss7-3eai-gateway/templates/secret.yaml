{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
# Chart-created Secret for SMOKE/DEV ONLY. In production leave secrets.create
# unset/false and point secrets.existingSecret at a platform-provisioned Secret
# (ADR-036 secretRef) so Arinna never handles the literals. Empty values are
# generated once and kept across upgrades (ss7-3eai-gateway.secretValue).
# jwt/hmac: 48 alphanumerics clears the gateway's 32-byte minimum.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ss7-3eai-gateway.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ss7-3eai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ include "ss7-3eai-gateway.secretValue" (dict "ctx" . "key" "jwt-secret" "value" .Values.secrets.jwtSecret "length" 48) | quote }}
  admin-password: {{ include "ss7-3eai-gateway.secretValue" (dict "ctx" . "key" "admin-password" "value" .Values.secrets.adminPassword "length" 32) | quote }}
  tdr-hmac-secret: {{ include "ss7-3eai-gateway.secretValue" (dict "ctx" . "key" "tdr-hmac-secret" "value" .Values.secrets.tdrHmacSecret "length" 48) | quote }}
  {{- with .Values.secrets.awsAccessKeyId }}
  aws-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSecretAccessKey }}
  aws-secret-access-key: {{ . | quote }}
  {{- end }}
{{- end }}
