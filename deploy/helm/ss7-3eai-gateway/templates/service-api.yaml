apiVersion: v1
kind: Service
metadata:
  name: {{ include "ss7-3eai-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ss7-3eai-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.api.type }}
  selector:
    {{- include "ss7-3eai-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
